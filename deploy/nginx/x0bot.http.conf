# www.x0bot.com: the same site's other name (TAILZU-BACKEND docs/domain-x0bot.md); 308 keeps a POST a POST
server {
    listen 80;
    server_name www.x0bot.com;
    # No access log: no visitor's address is written to disk (TAILZU-BACKEND docs/trust.md 8.3), as for the API.
    access_log off;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;
    # Let's Encrypt's check for the certificate (certbot certonly --webroot -w /var/www/letsencrypt)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        return 308 https://x0bot.com$request_uri;
    }
}
