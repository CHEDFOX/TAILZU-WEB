<style>
  /* One plane: textured off-white paper, a field of tiny words in the
     world's scripts, one ink character, one faint neon green for the waves. */
  :root {
    --paper: #EFEDE8;
    --card: #F6F5F1;
    --ink: #1C1A17;
    --ink-2: rgba(28, 26, 23, .64);
    --muted: rgba(28, 26, 23, .42);
    --neon: #39FF14;
    --grot: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --sys: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  html { background: var(--paper); }
  .glb { display: inline-block; white-space: nowrap; vertical-align: baseline; text-align: left; }
  .glb.held { clip-path: inset(0 -0.05em 0 0); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 12px/1.4 var(--sys);
    -webkit-tap-highlight-color: transparent;
  }
  #plane {
    position: fixed; inset: 0;
    background-color: var(--paper);
    background-size: 220px 220px;
  }
  #words { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
  #hero { position: relative; z-index: 2; height: 100vh; }
  #bot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  /* THE MAST, after the wave: the download on the left ("Take me home", to
     whatever this visitor's device installs), the name on the right. */
  .mast {
    position: fixed; z-index: 11; left: 0; right: 0; top: env(safe-area-inset-top, 0px);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding-top: 18px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .mast > * { visibility: hidden; }
  .mast.show .home { visibility: visible; pointer-events: auto; }
  .mast .name { opacity: 0; transform: translateX(28px); transition: opacity .5s ease, transform .8s cubic-bezier(.2, .9, .25, 1.12), visibility 0s .8s; }
  .mast.named .name { visibility: visible; opacity: 1; transform: none; pointer-events: auto; transition: opacity .5s ease, transform .8s cubic-bezier(.2, .9, .25, 1.12), visibility 0s; }
  /* The button is a key (Tailzu is a keyboard): a paper keycap on its
     skirt, a green LED in its corner, the device it is for as the small
     legend. Hover lifts the LED's glow; a press pushes the cap down onto
     its skirt; it leans a little towards the pointer. */
  .home {
    display: inline-block; text-decoration: none; color: var(--ink); border-radius: 13px; padding-bottom: 4px;
    background: linear-gradient(180deg, #D8D4CA, #C3BEB2);
    box-shadow: 0 0 0 1px rgba(28, 26, 23, .12), 0 1px 0 rgba(28, 26, 23, .22), 0 12px 24px -12px rgba(28, 26, 23, .5);
    translate: var(--mx, 0px) var(--my, 0px);
    transition: translate .3s cubic-bezier(.2, .9, .3, 1.3), box-shadow .35s ease;
  }
  .key-face {
    display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; align-items: center; column-gap: 10px; row-gap: 4px;
    padding: 10px 17px 9px 13px; border-radius: 12px;
    background: linear-gradient(180deg, #FFFEFB 0%, #F4F2EC 70%, #ECE9E2 100%);
    box-shadow: inset 0 1px 0 #fff, inset 0 -2px 0 rgba(28, 26, 23, .05), 0 0 0 1px rgba(28, 26, 23, .14);
    transition: transform .09s ease, background .3s ease;
  }
  .key-led { grid-row: 1 / 3; width: 7px; height: 7px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 5px 1px rgba(57, 255, 20, .7); animation: led 2.8s ease-in-out infinite; }
  .home-label { font: 800 15px/1 var(--grot); letter-spacing: -.015em; }
  .home-os { grid-column: 2; font: 500 10px/1 var(--sys); letter-spacing: .05em; color: var(--muted); }
  .home:hover { box-shadow: 0 0 0 1px rgba(28, 26, 23, .12), 0 1px 0 rgba(28, 26, 23, .22), 0 12px 26px -10px rgba(28, 26, 23, .45), 0 6px 28px -6px rgba(57, 255, 20, .38); }
  .home:hover .key-face { background: linear-gradient(180deg, #FFFFFF 0%, #F7F5F0 70%, #EFECE5 100%); }
  .home:hover .key-led { box-shadow: 0 0 8px 2px rgba(57, 255, 20, .9); }
  .home:active .key-face { transform: translateY(3px); }
  .home:focus-visible { outline: 2px solid var(--neon); outline-offset: 4px; }
  @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  /* While it arrives the page is soft and the key is lit. */
  .mast.lit .home { box-shadow: 0 0 0 1px rgba(28, 26, 23, .12), 0 1px 0 rgba(28, 26, 23, .22), 0 12px 26px -10px rgba(28, 26, 23, .45), 0 0 0 7px rgba(57, 255, 20, .1), 0 0 46px rgba(57, 255, 20, .42); }
  .mast .name { font: 800 23px/1 var(--grot); letter-spacing: -.035em; color: var(--ink); }
  /* The moment it arrives: everything else goes soft, the button alone is sharp. */
  .spot {
    position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: 0; visibility: hidden;
    background: rgba(239, 237, 232, .3);
    -webkit-backdrop-filter: blur(14px) saturate(.85); backdrop-filter: blur(14px) saturate(.85);
    transition: opacity .5s ease, visibility 0s .5s;
  }
  .spot.on { opacity: 1; visibility: visible; transition: opacity .45s ease, visibility 0s; }
  @media (prefers-reduced-motion: reduce) { .mast .name, .mast.named .name { transition: none; transform: none; } .key-led { animation: none; } .home, .key-face { transition: none; } }

</style>
