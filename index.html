        let hit = on[y * bw + x];
        if (!hit) for (let j = -1; j <= 1 && !hit; j++) for (let i = -1; i <= 1 && !hit; i++) { const xx = x + i, yy = y + j; if (xx >= 0 && yy >= 0 && xx < bw && yy < bh && on[yy * bw + xx]) hit = 1; }
        if (hit) { const px = ox + x * cell + cell / 2, py = oy + y * cell + cell / 2; g.moveTo(px + cell * .64, py); g.arc(px, py, cell * .64, 0, TAU); }
      }
      g.fill();
      // The dots: lit where the grey beats the dither's threshold.
      g.fillStyle = "#F3E2C6"; g.beginPath();
      for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
        const i = (y * bw + x) * 4, a = src[i + 3]; if (a < 90) continue;
        const lum = (src[i] * .3 + src[i + 1] * .59 + src[i + 2] * .11) / 255 * (a / 255);
        if (lum > (BAYER[(y & 7) * 8 + (x & 7)] + .5) / 64) { const px = ox + x * cell + cell / 2, py = oy + y * cell + cell / 2; g.moveTo(px + cell * .46, py); g.arc(px, py, cell * .46, 0, TAU); }
      }
      g.fill();
      g.restore();
      const hand = map(f.hand[0], f.hand[1]), ball = map(f.ball[0], f.ball[1]);
      // The antenna's ball lights green: the same green as the water.
      if (o.glow > .02) {
        const [x, y] = ball, r = H * .05, gr = g.createRadialGradient(x, y, 0, x, y, r * 2.4);
        gr.addColorStop(0, `rgba(120,255,90,${.55 * o.glow})`); gr.addColorStop(.3, `rgba(57,255,20,${.22 * o.glow})`); gr.addColorStop(1, "rgba(57,255,20,0)");
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 2.4, 0, TAU); g.fill();
      }
      return { hand, ball };
    };
  }

  // ---- The walker: his state, and his bouncy walk ---------------------------
  // One walk for every scene he walks into: a step per π of phase with a
  // little hop in each, the lead foot landing out in front (the water feels
  // it), braking to a stop. The scene says how tall he is, where the ground
  // is, how fast he goes, and where its water is (o.splash).
  const A0 = .62;
  function makeWalker(o) {
    const w = { x: 0, phase: 0, A: 0, v: 0, mirror: false, squash: 0, land: 0, air: 0, st: null };
    // Where a point in the figure's box lands on the screen.
    w.toScreen = (fx, fy) => {
      const H = o.H(), W = H * .84, ox = w.x - W / 2, oy = o.ground() - H;
      const lx = w.mirror ? W - fx : fx;
      return [ox + W / 2 + (lx - W / 2) * (1 - w.squash), oy + fy];
    };
    /** One frame of walking towards x = to. True on arrival. */
    w.stride = (dt, to) => {
      const H = o.H(), sp = o.speed(), slow = o.slow(), d = Math.abs(w.x - to);
      // Constant braking over the last stretch: v = √(2·a·d).
      w.v = d > slow ? sp : sp * Math.sqrt(Math.max(0, d / slow));
      const vk = clamp(w.v / sp);
      w.A = A0 * vk;
      // A bouncy walk: one step per π of phase, a little hop in each.
      const before = w.phase;
      w.phase += Math.PI * 3.5 * (.55 + .45 * vk) * dt;
      w.x += (to < w.x ? -1 : 1) * w.v * dt;
      if (Math.floor(w.phase / Math.PI) !== Math.floor(before / Math.PI)) {
        // The step's lead foot lands, out in front: the water feels it.
        const s = Math.floor(before / Math.PI) % 2 ? 1 : -1;
        const ax = H * .42 + s * .072 * H + Math.sin(w.A) * .21 * H + .04 * H;
        const [sx] = w.toScreen(ax, H);
        o.splash(sx, o.ground() - .01 * H, 1.25 * vk + .45, 3.6);
        w.land = 1;
      }
      if (d < 1.2 || (d < 24 && vk < .06)) { w.x = to; w.v = 0; w.land = 1; o.splash(w.x, o.ground() - 2, 1.6, 4.6); return true; }
      return false;
    };
    // Legs: the step's lead leg swings from behind to in front, the other
    // the other way; the whole figure is in the air at mid-step.
    w.gait = (dt) => {
      const st = w.st, H = o.H(), len = .21 * H, legs = st.legs, f = (w.phase / Math.PI) % 1, lead = Math.floor(w.phase / Math.PI) % 2;
      const vk = clamp(w.v / o.speed()), wk = clamp(w.A / A0), air = Math.sin(Math.PI * f) * Math.pow(vk, .8);
      legs[lead].th = lerp(-w.A, w.A, easeIO(f)); legs[1 - lead].th = -legs[lead].th * .7;
      legs[lead].lift = .035 * H * Math.sin(Math.PI * f) * vk; legs[1 - lead].lift = 0;
      w.air = air;
      st.drop = len * (1 - Math.cos(Math.max(Math.abs(legs[0].th), Math.abs(legs[1].th)))) - .07 * H * air;
      // Arms flap a little in turn, and flare out while it is in the air.
      st.ra = [.16 + .14 * wk * Math.sin(w.phase) + .3 * air, .12 + .1 * wk];
      st.la = [.16 - .14 * wk * Math.sin(w.phase) + .3 * air, .12 + .1 * wk];
      st.tilt = .05 * wk + .03 * wk * Math.sin(w.phase);
      st.antWob = .045 * H * wk * Math.sin(w.phase * 2 - 1.2);
      w.land = (w.land || 0) * Math.pow(.0005, dt);
    };
    w.draw = (g, dots, t, cell, glow) => dots(g, { H: o.H(), cell, x: w.x, y: o.ground(), mirror: w.mirror, squash: w.squash, land: w.land || 0, air: w.air || 0, st: w.st, t, glow });
    return w;
  }

  // ---- The opening's walker: in from the right, to the middle, a wave --------
  let BH = 240, cellPx = 3;
  const ground = () => Math.round(VH * (VW < 640 ? .6 : .56) + BH * .44);
  let T = 0, introDone = false;
  const SPEED = () => Math.max(170, Math.min(290, VW * .19));
  const B = makeWalker({ H: () => BH, ground, speed: SPEED, slow: () => Math.min(190, VW * .17), splash });
  function resetBot() {
    Object.assign(B, {
      x: VW + BH * .5, phase: 0, A: 0, v: 0, mirror: true, flipK: 1, squash: 0,
      st: { ra: [.16, .12], la: [.16, .12], brows: .3, tilt: 0, mouth: "smile", legs: [{ th: 0, lift: 0 }, { th: 0, lift: 0 }], drop: 0, bob: 0, swayK: 1, antWob: 0, walkK: 1, look: [1, .15] },
      glow: 0, mode: reduced ? "idle" : "wait", t0: 0, waveN: 0,
    });
    if (reduced) { introDone = true; B.x = VW / 2; B.mirror = false; B.st.walkK = 0; B.st.look = [0, 0]; B.st.ra = [2.5, -.55]; B.st.mouth = "grin"; B.st.brows = .7; }
  }

  function updateBot(dt) {
    const st = B.st, t = T;
    st.bob = Math.sin(t * TAU * .9) * .008 * BH * (1 - st.walkK);
    if (B.mode === "wait") { if (t > .5) B.mode = "walk"; return; }
    if (B.mode === "walk" && B.stride(dt, VW / 2)) { B.mode = "settle"; B.t0 = t; }
    if (B.mode === "settle") {
      B.A *= Math.pow(.02, dt);
      if (t - B.t0 > .34) { B.mode = "turn"; B.t0 = t; }
    }
    if (B.mode === "turn") {
      const k = clamp((t - B.t0) / .2);
      B.squash = Math.sin(Math.PI * k) * .18;
      if (k > .5 && B.mirror) B.mirror = false;
      st.walkK = 1 - easeOut(k);
      st.look = [lerp(1, 0, k), lerp(.15, 0, k)];
      if (k >= 1) { B.squash = 0; B.mode = "wave"; B.t0 = t; B.waveN = 0; }
    }
    B.gait(dt);
    if (B.mode === "wave" || B.mode === "idle") {
      const k = B.mode === "wave" ? t - B.t0 : 99;
      const up = reduced ? 1 : easeOut(k / .45) - easeIO((k - 3.4) / .55);
      const osc = k > .35 && k < 3.5 ? Math.sin((k - .35) * TAU * 1.45) : 0;
      st.ra = [lerp(.16, 2.5, up), lerp(.12, -.55, up) + .34 * osc * up];
      st.la = [.16, .12];
      st.mouth = up > .3 ? "grin" : "smile"; st.brows = lerp(.3, .75, up); st.tilt = -.06 * up;
      B.glow = Math.max(0, up);
      // Each wave of the hand sends a small ring out of it.
      const n = Math.floor(Math.max(0, k - .35) * 1.45 + .25);
      if (B.mode === "wave" && k > .45 && k < 3.4 && n > B.waveN && last.hand) { B.waveN = n; splash(last.hand[0], last.hand[1], .8, 3.2); }
      if (B.mode === "wave" && k > 4.1) { B.mode = "idle"; introDone = true; }
    }
    if (B.mode === "idle") {
      st.look = [lerp(st.look[0], lookAim[0], .08), lerp(st.look[1], lookAim[1], .08)];
      B.glow *= .97;
    }
  }

  const last = { hand: null, ball: null };
  const heroDots = makeDots();
  function drawBot(t) {
    const g = bctx;
    g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, VW, VH);
    if (B.mode === "wait") return;
    const f = B.draw(g, heroDots, t, cellPx, B.glow);
    last.hand = f.hand; last.ball = f.ball;
  }

  // ---- The visitor's hand on the water, once the bot has said hello --------
  const lookAim = [0, 0];
  let lastPt = null;
  addEventListener("pointermove", (e) => {
    const now = performance.now();
    if (introDone) {
      const H = BH, cx = B.x, cy = ground() - H * .7;
      lookAim[0] = clamp((e.clientX - cx) / (VW * .35), -1, 1); lookAim[1] = clamp((e.clientY - cy) / (VH * .35), -1, 1);
    }
    if (!introDone || reduced) { lastPt = null; return; }
    if (lastPt && now - lastPt.t > 22) {
      const d = Math.hypot(e.clientX - lastPt.x, e.clientY - lastPt.y), sp = d / (now - lastPt.t) * 1000;
      if (sp > 40) splash(e.clientX, e.clientY, Math.min(.75, sp / 2600), 2);
      lastPt = { x: e.clientX, y: e.clientY, t: now }; wake();
    } else if (!lastPt) lastPt = { x: e.clientX, y: e.clientY, t: now };
  }, { passive: true });
  addEventListener("pointerdown", (e) => { if (introDone && !reduced) { splash(e.clientX, e.clientY, 1.6, 2.6); wake(); } }, { passive: true });

  /* =====================================================================
     THE GLITCH (as on tailzu.space today). The word under the cursor
     flickers into ones and zeros and resolves back, left to right, in half
     a second: one word at a time, so a sweep across a sentence leaves a
     trail. All the text on the page, the plane's tiny words included. A
     pointer drives it by hovering, a finger by touching and dragging.
     Never under reduced motion.
     ================================================================== */
  const GLITCH_AT = "h1,h2,h3,p,li,a,button,span,b,i,em,strong,label";
  const glitchOn = new WeakMap();
  // The word under a point: the text node and the run of non-space
  // characters around the caret the browser puts there.
  function wordAt(x, y) {
    let node, off;
    if (document.caretPositionFromPoint) { const c = document.caretPositionFromPoint(x, y); if (!c) return null; node = c.offsetNode; off = c.offset; }
    else if (document.caretRangeFromPoint) { const r = document.caretRangeFromPoint(x, y); if (!r) return null; node = r.startContainer; off = r.startOffset; }
    else return null;
    if (!node || node.nodeType !== 3) return null;
    const pe = node.parentElement;
    if (!pe || pe.classList.contains("glb") || pe.closest("svg, script, style")) return null;
    const elm = pe.closest(GLITCH_AT); if (!elm) return null;
    const t = node.nodeValue;
    if (!/\S/.test(t.charAt(off))) { if (off > 0 && /\S/.test(t.charAt(off - 1))) off--; else return null; }
    let a = off, b = off;
    while (a > 0 && /\S/.test(t.charAt(a - 1))) a--;
    while (b < t.length && /\S/.test(t.charAt(b))) b++;
    const rg = document.createRange(); rg.setStart(node, a); rg.setEnd(node, b);
    const box = rg.getBoundingClientRect();
    if (x < box.left - 2 || x > box.right + 2 || y < box.top - 2 || y > box.bottom + 2) return null;
    return { node, a, b, elm };
  }
  // The line never moves: the word goes into a box of its own width, the
  // digits are drawn inside it, then it goes back as text.
  function glitchWord(w) {
    const elm = w.elm, nd = w.node, tok = nd.nodeValue.slice(w.a, w.b);
    if (!tok) return;
    nd.splitText(w.b);
    const mid = nd.splitText(w.a);
    const box = document.createElement("span"); box.className = "glb"; box.textContent = tok;
    mid.parentNode.replaceChild(box, mid);
    box.style.width = box.getBoundingClientRect().width.toFixed(2) + "px";
    box.classList.add("held");
    glitchOn.set(elm, (glitchOn.get(elm) || 0) + 1);
    const chars = Array.from(tok), dur = Math.min(720, 240 + chars.length * 44);
    let t0 = 0, lastFlip = 0, rnd = [];
    const flip = () => { rnd = chars.map(() => (Math.random() < .5 ? "0" : "1")); };
    flip();
    function undo() {
      const host = box.parentNode;
      if (host) { host.replaceChild(document.createTextNode(tok), box); host.normalize(); }
      const n = (glitchOn.get(elm) || 1) - 1;
      if (n > 0) glitchOn.set(elm, n); else glitchOn.delete(elm);
    }
    (function step(now) {
      if (!t0) t0 = now;
      const k = Math.min(1, (now - t0) / dur);
      if (now - lastFlip > 46) { flip(); lastFlip = now; }
      const front = Math.min(chars.length, Math.floor(chars.length * k * 1.12));
      box.textContent = chars.slice(0, front).join("") + rnd.slice(front).join("");
      if (k < 1) requestAnimationFrame(step); else undo();
    })(performance.now());
  }
  if (!reduced) {
    let moveRaf = 0, mx = 0, my = 0;
    // One word per frame, wherever the point is by then: the page's text
    // first, the plane's tiny words where no page text is over them.
    const aim = (x, y) => {
      mx = x; my = y;
      if (moveRaf) return;
      moveRaf = requestAnimationFrame(() => {
        moveRaf = 0;
        const w = wordAt(mx, my);
        if (w) return glitchWord(w);
        const top = document.elementFromPoint(mx, my);
        if (!top || top === wordsCv || top === botCv || top.id === "plane" || top.id === "hero" || top === document.body || top === document.documentElement) { glitchPlane(mx, my); wake(); }
      });
    };
    document.addEventListener("mousemove", (e) => aim(e.clientX, e.clientY), { passive: true });
    const touch = (e) => { const t = e.touches && e.touches[0]; if (t) aim(t.clientX, t.clientY); };
    document.addEventListener("touchstart", touch, { passive: true });
    document.addEventListener("touchmove", touch, { passive: true });
  }

  // ---- After the wave, the key ---------------------------------------------
  let mastOn = false;
  const mast = document.getElementById("mast"), homeA = document.getElementById("home");
  const spot = document.getElementById("spot");
  // After the wave: the page goes soft, the button appears big in the middle,
  // holds, then flies to its place in the mast as the page comes back; the
  // name follows.
  function revealMast() {
    mast.classList.add("show");
    if (reduced) { mast.classList.add("named"); return; }
    // Right where it lives: everything else goes soft, the key alone is
    // sharp and lit; then the page comes back and the name follows.
    spot.classList.add("on"); mast.classList.add("lit");
    homeA.animate([
      { opacity: 0, transform: "translateY(-8px) scale(.9)" },
      { opacity: 1, transform: "translateY(0) scale(1.07)", offset: .55 },
      { opacity: 1, transform: "none" },
    ], { duration: 720, easing: "cubic-bezier(.2, .9, .3, 1.2)" });
    setTimeout(() => { if (!mastOn) return; spot.classList.remove("on"); mast.classList.remove("lit"); }, 1500);
    setTimeout(() => { if (!mastOn) return; mast.classList.add("named"); }, 1650);
  }
  if (!reduced && matchMedia("(hover: hover)").matches) {
    homeA.addEventListener("pointermove", (e) => {
      const r = homeA.getBoundingClientRect();
      homeA.style.setProperty("--mx", (((e.clientX - r.left) / r.width - .5) * 8).toFixed(1) + "px");
      homeA.style.setProperty("--my", (((e.clientY - r.top) / r.height - .5) * 6).toFixed(1) + "px");
    });
    homeA.addEventListener("pointerleave", () => { homeA.style.setProperty("--mx", "0px"); homeA.style.setProperty("--my", "0px"); });
  }
  // The button knows the visitor (the live site's detect()/hrefFor(); the
  // links are /v1/site's stores and downloads as served today).
  (function homeLink() {
    const ua = navigator.userAgent || "";
    const os = /iPhone|iPod|iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? "ios"
      : /Android/.test(ua) ? "android" : /CrOS/.test(ua) ? "chromeos" : /Windows/.test(ua) ? "win" : /Mac OS X|Macintosh/.test(ua) ? "mac" : /Linux/.test(ua) ? "linux" : "other";
    const DL = "https://api.x0bot.com/downloads/";
    const HREF = { ios: "https://apps.apple.com/app/id6784811357", android: "https://play.google.com/store/apps/details?id=com.tulmi.app", win: "https://get.microsoft.com/installer/download/9N3GX0XHQ7MX?referrer=appbadge&source=x0bot.com", mac: DL + "Tailzu.dmg", linux: DL + "Tailzu.AppImage" };
    const NAME = { ios: "iPhone", android: "Android", win: "Windows", mac: "Mac", linux: "Linux" };
    homeA.href = HREF[os] || "/download";
    document.getElementById("homeOs").textContent = NAME[os] ? `X0 Bot for ${NAME[os]}` : "Get X0 Bot";
    homeA.dataset.os = os;
    homeA.setAttribute("aria-label", NAME[os] ? `Take me home: get X0 Bot for ${NAME[os]}` : "Take me home: get X0 Bot");
  })();
  // Once he has said hello, the key arrives.
  function maybeMast() { if (introDone && !mastOn) { mastOn = true; revealMast(); } }

  // ---- Size, loop, replay ----------------------------------------------------
  function fit() {
    VW = root.clientWidth || innerWidth; VH = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
    FS = VW < 640 ? 5.8 : 6.4; LINE = VW < 640 ? 9.5 : 10.5;
    BH = Math.round(clamp(Math.min(VH * .24, VW * .38), 120, 225));
    cellPx = Math.max(2, Math.round(BH / 92 * DPR)) / DPR;
    [wordsCv, botCv].forEach((c) => { c.width = Math.round(VW * DPR); c.height = Math.round(VH * DPR); });
    makeSprites(); makeField(); layout();
    wordsDirty = true;
  }
  function fitAll() { fit(); hero.style.height = VH + "px"; }
  let raf = 0, lastMs = 0;
  function wake() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame(ms) {
    raf = 0;
    const dt = Math.min(.05, lastMs ? (ms - lastMs) / 1000 : .016); lastMs = ms;
    T += dt;
    updateBot(dt);
    if (!reduced) stepField();
    drawWords();
    drawBot(T);
    maybeMast();
    wake();
  }
  function replay() {
    mastOn = false; mast.classList.remove("show", "named", "lit"); spot.classList.remove("on");
    homeA.getAnimations().forEach((a) => a.cancel());
    makeField(); T = 0; lastMs = 0; introDone = false; lastPt = null; lookAim[0] = lookAim[1] = 0;
    resetBot(); wordsDirty = true; wake();
  }
  let rz = 0;
  addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const x = B.mode === "wait" || B.mode === "walk"; fitAll(); if (x) replay(); else { B.x = VW / 2; wordsDirty = true; } }, 120); });
  fitAll(); resetBot(); wake();
})();
</script>
