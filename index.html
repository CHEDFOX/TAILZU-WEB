<!doctype html>
<html lang="en" data-api="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tailzu</title>
<meta name="description" content="Talk. It writes. Every word you meant, none you didn't, in the language you said it. 22 Indian languages and most of the world's.">
<meta name="theme-color" content="#0F0D0B">
<meta property="og:title" content="Tailzu — say it badly, send it perfect">
<meta property="og:description" content="Talk. It writes. No sign-up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Instrument+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&family=Caveat:wght@400..700&family=Kalam:wght@400;700&display=swap">
<style>
  :root {
    /* THE STATS PALETTE, unchanged from the app.
       One material system across the product: a warm near-black biased toward
       the accent's own hue, so the amber sits IN the ground rather than on it;
       a card that is a step up from the ground rather than a hole in it; and
       one reading colour, which is the amber's own family. Everything that
       was a second colour here is now the same pale at a lower weight —
       that is the app's rule, and it is why the amber still means something.
       A paper half would have been a second visual world, and a colour cannot
       be sacred if the ground under it changes temperature. */
    --ink: #0F0D0B; --card: #1A1714; --rule: rgba(243,226,198,.10);
    --white: #F3E2C6; --grey: rgba(243,226,198,.55); --dim: rgba(243,226,198,.36);
    --amber: #E8A23C;
    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--ink); }
  body {
    margin: 0; background: var(--ink); color: var(--white);
    font-family: var(--sans); font-size: 16px; line-height: 1.65;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  /* THE AMBER IS SACRED. It appears in three places and they are one
     meaning: the caret while the microphone is open, the button while it is
     open, and the words just born at the caret. Alive, right now. Nothing
     that is merely hovered, focused, selected or emphasised gets it —
     those are done with the pale at full weight, which is the app's rule. */
  :focus-visible { outline: 2px solid var(--white); outline-offset: 4px; }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 28px; }
  .eye { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }

  /* ---- masthead ------------------------------------------------------- */
  .mast { position: relative; z-index: 6; display: flex; justify-content: space-between; align-items: center; padding: 26px 0; }
  .mark { font-family: var(--serif); font-size: 23px; letter-spacing: .01em; }
  .mast nav { display: flex; gap: 26px; align-items: center; }
  .mast nav a { color: var(--grey); font-size: 13.5px; transition: color .18s; }
  .mast nav a:hover { color: var(--white); }
  .mast nav a.cta { color: var(--ink); background: var(--white); padding: 9px 18px; border-radius: 999px; font-weight: 500; font-size: 13px; }
  .mast nav a.cta:hover { opacity: .82; }

  /* ---- titles ----------------------------------------------------------
     Three, none over four words, none in the accent. A title is a claim and
     the thing under it is the proof, so each stays short enough to be read
     after the proof rather than instead of it.                             */
  .hero { text-align: center; padding: 30px 0 0; }
  h1 { margin: 0 auto; font-family: var(--serif); font-weight: 400; font-size: clamp(38px, 5.4vw, 68px); line-height: 1.05; letter-spacing: -.022em; text-wrap: balance; }
  .sheet h2 { margin: 0 auto 44px; text-align: center; font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -.02em; }
  .get h3 { margin: 0 0 10px; font-family: var(--serif); font-weight: 400; font-size: clamp(26px, 3vw, 38px); line-height: 1.05; letter-spacing: -.02em; }

  /* ---- the ribbon ------------------------------------------------------
     There is no hero above this any more, so this IS the hero. Many in, one
     out — the shape of the product and the shape of the picture. The button
     sits on the crossing, because pressing it puts your own voice through
     the same funnel.

     The height stays 520. It is tempting to grow it now that it is the first
     thing, and growing it is wrong: the svg is SLICED, so a taller band does
     not show more of the drawing, it zooms into the middle of it and crops
     the sides. Tried at 660 — the threads lost their entry points off the
     left edge and the one line going the other way ran off the right.      */
  .river { position: relative; margin-top: 4px; height: 520px; animation: fade 1.4s .35s both; }
  /* No bands. Speech runs on the page itself, and the mask dissolves it into
     the ground at both edges rather than letting the viewport cut it off —
     so nothing on this page has a visible strip around it. The mask is on the
     svg, not the container, so the mark drawn over it stays crisp. */
  /* Fades on all four edges now, not just the sides: the lanes come over the
     top and up from underneath, and a lane chopped off at the band's edge
     reads as a rendering fault rather than as speech arriving from off-stage.
     Two gradients intersected — the sides and the ends. */
  .river #riverSvg {
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 13%, #000 87%, transparent 100%),
                        linear-gradient(180deg, transparent 0, #000 11%, #000 90%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 13%, #000 87%, transparent 100%),
                        linear-gradient(180deg, transparent 0, #000 11%, #000 90%, transparent 100%);
    -webkit-mask-composite: source-in;
            mask-composite: intersect;
  }
  /* The caret must not fade with the rest: it sits at the centre, where both
     gradients are solid, so it is unaffected — but the one line going the
     other way does want the side fade, and gets it from the same mask. */

  /* UGLY ON PURPOSE, and set in script rather than here: speech has no
     typography, so each lane takes whatever face the machine happens to have,
     at whatever size, with whatever tracking — some of it squeezed until the
     words run together. Nothing is loaded from a font host, because the point
     is that these are the defaults nobody chose. */

  /* One line, and every decision on it made on purpose: the optical size the
     face was cut for, a hair of tracking, and nothing else on the page set
     like it. That contrast is the whole product in one picture. */
  .clean {
    font-family: var(--serif); font-size: 24px; font-weight: 400;
    font-optical-sizing: auto; letter-spacing: .004em; fill: url(#fresh);
  }
  /* Both layers of the river sit on top of each other and drift together.
     will-change keeps them on their own layers, so the drift moves a painted
     surface instead of asking for it to be painted again. */
  #tangle, #riverSvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; will-change: transform; }
  #tangle { z-index: 0; }
  #riverSvg { z-index: 1; }

  /* The caret. 530ms on, 530ms off, which is the rate a real one blinks at —
     any faster reads as an error state, any slower as a dying battery. */
  #mark { cursor: pointer; }
  #mark:focus-visible { outline: 2px solid var(--white); outline-offset: 10px; border-radius: 8px; }
  .caret { fill: var(--white); animation: blink 1.06s steps(1) infinite; }
  @keyframes blink { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: .1; } }
  /* Open microphone: it stops blinking and holds, because now there is
     something to wait for rather than nothing. */
  .river.on .caret { animation: none; opacity: 1; fill: var(--amber); }

  /* The control sits under the mark; its position is measured, not guessed,
     because the svg is sliced and the mark lands somewhere different at
     every window width. */
  .speak {
    position: absolute; left: 50%; top: 78%; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 9px; height: 46px; padding: 0 22px;
    border: 0; border-radius: 999px; background: var(--white); color: var(--ink);
    font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
    transition: background .18s, transform .18s; -webkit-tap-highlight-color: transparent;
  }
  .speak:hover { opacity: .9; transform: translateX(-50%) translateY(-1px); }
  .speak[aria-pressed="true"] { background: var(--amber); }
  /* The lanes run underneath the controls now, so the off state needs a
     ground of its own — a transparent pill over moving text is unreadable. */
  .speak[disabled] { background: rgba(15,13,11,.82); color: var(--dim); box-shadow: inset 0 0 0 1px var(--rule); cursor: default; }
  .speak svg { width: 16px; height: 16px; }
  .under { position: absolute; left: 50%; transform: translateX(-50%); top: calc(78% + 58px); width: max-content; max-width: 90vw; text-align: center; color: var(--dim); font-size: 13px; text-shadow: 0 0 12px var(--ink), 0 0 6px var(--ink), 0 0 3px var(--ink); }
  .under.err { color: var(--white); }

  /* ---- the sheet ------------------------------------------------------
     The ground does not change. What lifts the card off it is the card's own
     step up in value and a hairline rule, which is how the app separates
     anything from anything — the same two moves, at a bigger size.

     THE CARD IS PINNED AND THE CLAIM ON IT CHANGES AS YOU GO PAST. One
     viewport of scroll per claim: reading is the same gesture as advancing,
     so nobody waits for a carousel and nobody misses one. The river already
     answers the wheel; this is the same page answering it twice.           */
  .sheet { position: relative; z-index: 2; background: var(--ink); color: var(--white); }
  .track { height: 300vh; }
  .stick { position: sticky; top: 0; min-height: 100vh; display: flex; align-items: center; }
  .stick > .wrap { width: 100%; }

  .steps { display: grid; grid-template-columns: 250px 1fr; gap: 64px; align-items: start; }
  .rail { display: flex; flex-direction: column; gap: 2px; }
  .rail button {
    position: relative; text-align: left; border: 0; background: none; cursor: pointer;
    padding: 13px 0 13px 20px; color: var(--dim); font-family: var(--serif); font-size: 20px;
    transition: color .3s; line-height: 1.3;
  }
  .rail button::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--rule); }
  /* The progress bar grows by SCALE, not by height. Transitioning height is a
     layout-inducing property, and a six-second one of those runs the layout
     engine on every frame it is alive — measured at two thirds of the page's
     frame rate, all of it spent nowhere near the thing that looked expensive.

     It is filled from scroll now, so it is a position rather than a timer:
     it says how far through this claim you are, and it runs backwards when
     you do. `timed` is the fallback for a window too short to pin in. */
  .rail button::after {
    content: ""; position: absolute; left: 0; top: 0; width: 2px; height: 100%;
    background: var(--white); transform: scaleY(var(--fill, 0)); transform-origin: top;
  }
  .rail button[aria-selected="true"] { color: var(--white); }
  .rail.timed button[aria-selected="true"]::after { transform: scaleY(1); transition: transform var(--dwell, 6000ms) linear; }
  .rail p { margin: 0; padding: 0 0 4px 20px; color: var(--grey); font-size: 14.5px; max-width: 30ch; }

  /* the transcript card */
  .card { position: relative; background: var(--card); border: 1px solid var(--rule); border-radius: 22px; padding: 40px 42px 34px; min-height: 300px; overflow: hidden; }
  .card .eye { text-align: left; color: var(--dim); margin: 0 0 18px; }
  .raw { margin: 0 0 30px; font-size: 21px; line-height: 1.85; color: rgba(243,226,198,.72); }
  .raw span { transition: color .45s, opacity .45s, text-decoration-color .45s; }
  .raw span.gone { color: var(--dim); opacity: .42; text-decoration: line-through; text-decoration-color: rgba(243,226,198,.3); text-decoration-thickness: 1px; }
  /* A kept word is the pale at full weight with a hairline under it, in both
     lines, so "this did not move" reads the same before and after. Not the
     accent: a fact that survived is a record, not a thing still in play. */
  .raw span.hit, .out b { color: var(--white); text-decoration: underline; text-decoration-color: rgba(243,226,198,.38); text-decoration-thickness: 1px; text-underline-offset: .2em; }
  .out { margin: 0; font-family: var(--serif); font-size: clamp(22px, 2.5vw, 30px); line-height: 1.4; color: var(--white); min-height: 1.4em; }
  .out b { font-weight: 500; }
  /* The rule and the reason share one row: the pill names what just happened
     to the line above it, and sits on the line that divides before from after. */
  .mid { display: flex; align-items: center; gap: 18px; margin: 0 0 26px; min-height: 30px; flex-wrap: wrap; }
  .mid i { flex: 1 1 60px; height: 1px; background: var(--rule); }
  /* inline-block, not inline-flex: a flex container drops the whitespace
     between its children, which runs the pill's own words together. */
  /* On the dark card a solid chip would be a third value in a system that has
     two. A hairline outline separates it the way every rule on Stats does,
     and leaves the amber inside it as the only bright thing in the row. */
  .pill {
    flex: 0 1 auto; display: inline-block; padding: 7px 15px;
    border-radius: 999px; box-shadow: inset 0 0 0 1px var(--rule); color: var(--grey);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s;
  }
  .pill.show { opacity: 1; transform: none; }
  .pill em { font-style: normal; color: var(--white); }

  /* ---- download -------------------------------------------------------- */
  .get { background: var(--ink); color: var(--white); padding: 0 0 104px; }
  /* Centre, not baseline: with the heading gone there is nothing left on the
     left to sit a baseline against, and the platform line alone hung under
     the buttons instead of beside them. */
  .getin { border-top: 1px solid var(--rule); padding-top: 56px; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; flex-wrap: wrap; }
  .get .note { margin: 0; color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: .16em; }
  .dl { display: flex; gap: 10px; flex-wrap: wrap; }
  .dl a { display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 999px; border: 1px solid var(--rule); color: var(--grey); font-size: 13.5px; transition: border-color .2s, color .2s; }
  .dl a:hover { border-color: var(--grey); color: var(--white); }
  /* The pale is the loud colour on a dark ground, the way the app's own
     figures are lights. Amber on hover, because hover is the live state. */
  .dl a.primary { background: var(--white); border-color: var(--white); color: var(--ink); font-weight: 500; }
  .dl a.primary:hover { opacity: .85; }
  .dl a.soon { opacity: .4; pointer-events: none; }

  footer { background: var(--ink); color: var(--dim); }
  footer .in { border-top: 1px solid var(--rule); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 26px 0 40px; font-size: 13px; }
  footer nav { display: flex; gap: 24px; }

  /* ---- motion ---------------------------------------------------------- */
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .reveal { opacity: 0; transform: translateY(26px); transition: opacity .9s cubic-bezier(.2,.85,.25,1), transform .9s cubic-bezier(.2,.85,.25,1); }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 900px) {
    .river { height: 380px; }
    .steps { grid-template-columns: 1fr; gap: 34px; }
    .rail { flex-direction: row; overflow-x: auto; gap: 0; }
    .rail button { white-space: nowrap; padding: 10px 18px 12px; font-size: 17px; }
    .rail button::before { left: 0; top: auto; bottom: 0; right: 0; width: auto; height: 2px; }
    .rail button::after { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 2px; transform: scaleX(var(--fill, 0)); transform-origin: left; }
    .rail.timed button[aria-selected="true"]::after { transform: scaleX(1); transition: transform var(--dwell, 6000ms) linear; }
    .rail p { display: none; }
    .card { padding: 30px 24px 28px; }
    .pill { left: 24px; bottom: 112px; }
    .mast nav a:not(.cta) { display: none; }
  }
  /* Too short to pin anything in: the track collapses, the block flows, and
     the script sees a span of zero and goes back to the timer. */
  @media (max-height: 560px) {
    .track { height: auto; }
    .stick { position: static; min-height: 0; padding: 72px 0; }
  }
  @media (max-width: 560px) {
    .river { height: 320px; }
    .speak span { font-size: 12.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <a class="mark" href="/">Tailzu</a>
    <nav>
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
      <a href="/download" class="cta" id="navdl">Download</a>
    </nav>
  </header>

  <!-- Three words. The river underneath is the proof, and a title short
       enough is read after the proof rather than instead of it. -->
  <section class="hero"><h1 id="headline">Talk. It writes.</h1></section>
</div>

<div class="river" id="river">
  <!-- The tangle is drawn on a canvas, not in the svg. Two dozen moving
       textPaths cost the page two thirds of its frame rate: changing one
       offset re-lays its whole string out along its curve, and that is a
       layout the browser cannot skip. Measured — freezing the offsets alone
       took it from 23fps back to 59. -->
  <canvas id="tangle" aria-hidden="true"></canvas>

  <svg id="riverSvg" viewBox="0 0 1440 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <path id="out1" d="M728 284 L1800 284"/>
      <!-- The sentence forms as it leaves the caret instead of arriving whole
           at a hard edge, which reads as sliding out from behind a sheet. -->
      <linearGradient id="emerge" gradientUnits="userSpaceOnUse" x1="728" y1="0" x2="792" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity="1"/>
      </linearGradient>
      <!-- BORN AMBER, SETTLING TO PALE. Amber marks what is still in play,
           in the app and here: the words nearest the caret have just been
           written, and they cool to the reading colour as they move away
           and become the record. The one colour on the page with a meaning,
           doing that meaning. -->
      <linearGradient id="fresh" gradientUnits="userSpaceOnUse" x1="728" y1="0" x2="1080" y2="0">
        <stop offset="0" style="stop-color: var(--amber)"/>
        <stop offset="0.28" style="stop-color: var(--amber)"/>
        <stop offset="1" style="stop-color: var(--white)"/>
      </linearGradient>
      <mask id="leaving"><rect x="716" y="-140" width="1200" height="800" fill="url(#emerge)"/></mask>
    </defs>

    <g mask="url(#leaving)">
      <text class="clean" dy=".33em"><textPath href="#out1" id="tOut" startOffset="0"> </textPath></text>
    </g>

    <!-- THE CARET. Not an ornament standing in for the product: it is the
         product. Everything Tailzu does ends at somebody's cursor, so the
         cursor is what the speech runs into and what the sentence comes out
         of. It blinks at the rate a real one does, and while the microphone
         is open it stops blinking and breathes with the voice. -->
    <g id="mark" role="button" tabindex="0" aria-label="Speak">
      <rect id="caret" class="caret" x="716" y="248" width="8" height="72" rx="4"/>
    </g>
  </svg>

  <button class="speak" id="mic" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="3" width="6" height="11" rx="3"></rect>
      <path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3M9 21h6"></path>
    </svg>
    <span id="micLabel">Speak</span>
  </button>
  <span class="under" id="under">No sign-up. It stops when you pause.</span>
</div>

<section class="sheet">
  <!-- Three viewports of scroll, one card pinned in the middle of them. -->
  <div class="track" id="track">
    <div class="stick" id="stick">
      <div class="wrap">
        <h2 class="reveal" id="proof">Only the mess goes.</h2>
        <div class="steps reveal">
          <div class="rail" id="rail" role="tablist" aria-label="What it does"></div>
          <div class="card">
            <span class="eye">Said</span>
            <p class="raw" id="raw"></p>
            <div class="mid"><i></i><span class="pill" id="pill"></span></div>
            <span class="eye">Wrote</span>
            <p class="out" id="out"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="get">
  <div class="wrap">
    <div class="getin reveal">
      <div>
        <h3 id="getTitle">Free to start.</h3>
        <p class="note" id="platforms">MAC · WINDOWS · iPHONE · ANDROID</p>
      </div>
      <div class="dl" id="dl"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap"><div class="in">
    <span>© 2026 Tailzu</span>
    <nav><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/download">Download</a></nav>
  </div></div>
</footer>

<script>
(function () {
  "use strict";
  var API = document.documentElement.getAttribute("data-api") || "";
  if (!API && location.protocol === "file:") API = "https://api.tailzu.space";
  var $ = function (id) { return document.getElementById(id); };
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- copy: the backend's, with this as the fallback --------------------
  var C = {
    headline: "Talk. It writes.", proof: "Only the mess goes.", get: "Free to start.",
    cta: "Speak", ctaHeld: "Stop", writing: "Writing…", again: "Again",
    invite: "No sign-up. Stops when you pause.",
    after: "That's it. Everywhere you type.",
    demoOff: "Demo asleep. The apps aren't.",
    micDenied: "Mic blocked. Allow it, try again.",
    // What leaves the caret when nobody has spoken yet. Not a sample of the
    // product's output — a statement of what it is, running at reading speed
    // against thirteen lanes of noise.
    identity: [
      "Every word you meant.",
      "None you didn't.",
      "In your language.",
      "Tailzu."
    ],
    cases: [
      { said: "um so like can we push the call to four",          wrote: "Can we push the call to four?" },
      { said: "the deploy is done but abhi testing baaki hai",    wrote: "The deploy is done, but abhi testing baaki hai." },
      { said: "हाँ वो फाइल मैंने भेज दी थी कल शाम को",                  wrote: "हाँ, वो फाइल मैंने कल शाम भेज दी थी।" },
      { said: "நான் இப்போ கிளம்பறேன் கொஞ்சம் லேட் ஆகும்",              wrote: "நான் இப்போ கிளம்பறேன், கொஞ்சம் லேட் ஆகும்." },

     THE RIVER

     One path across the page. Everything anybody ever said travels along it
     from the left, is swallowed at the mark, and leaves to the right as
     a written sentence. The two halves are the same path with the same
     motion, clipped either side of the mark — which is why the change
     appears to happen AT the microphone rather than near it.

     take over both halves: the mess you actually said flows in, and your
     sentence flows out. The page stops arguing and hands the argument over.

   * against each other and read as one repeating pattern rather than three
   * separate people talking at once.

   * three scripts are on screen at once instead of three lanes of English

     from a fixed seed — the same mess on every load, tunable by one number.

       · the control points step rightward, which makes x monotonic and is
         the only thing standing between this and upside-down words;
       · the last control point sits level with the caret, so nothing arrives
         at an angle and gets rotated where it meets the cursor;
       · the middle one is thrown anywhere at all, and that is where the
         crossing and the knotting come from.

     ground and a few come up almost to paper, so the left has depth rather
     than one even wash of grey.

     under its first letter. Setting a transform per glyph is five times the
     work for a difference nobody can see on curves this long and this shallow.
     ------------------------------------------------------------------- */

     where a filled curve is forty — which is the trade that buys the count.

     threads 39fps, 96 threads 32fps, 116 threads 28fps. Raising it is one

     to whatever the machine has — the canvas does that on its own. One hand

         thread crawling behind a dim one racing past reads as noise, because
         the eye is trying to build a space out of it and cannot. Coupled,

   * the cost of this is linear in words drawn per frame and a full curve at
   * thread weight is forty words where a phrase is seven. Six times fewer
   * words is six times the threads for the same frame — and six times the

  var boost = 1, lastY = window.pageYOffset || 0;
  window.addEventListener("scroll", function () {
    var y = window.pageYOffset || 0, d = Math.abs(y - lastY); lastY = y;
    boost = Math.min(9, boost + d * 0.045);
    cardScroll();               // one listener, one read of the offset
  }, { passive: true });

  /* ---------------------------------------------------------------------
     THE CARET

     Everything this product does ends at somebody's cursor, so the cursor is
     what the speech runs into and what the sentence comes out of. No object
     standing in for the product — the product's own destination.

     It holds still and blinks while nothing is happening. With the microphone
     open it stops blinking, turns amber and breathes with the voice, so what
     grows and shrinks is the thing the words are about to be written at.   */
  var caret = $("caret"), MID = 284, REST = 72, listening = false, voice = 0, level = 0;

  function drawCaret(live) {
    voice += ((live ? level : 0) - voice) * 0.22;      // eased, or it judders
    var h = REST + voice * 86;
    caret.setAttribute("y", (MID - h / 2).toFixed(1));
    caret.setAttribute("height", h.toFixed(1));
  }
  drawCaret(false);

  function river(now) {
    rraf = requestAnimationFrame(river);
    if (!last) last = now;
    var dt = Math.min(64, now - last); last = now;
    boost += (1 - boost) * Math.min(1, dt / 620);      // falls back to a walk

    for (var i = 0; i < LANES.length; i++) {
      var L = LANES[i];
      L.off = (L.off + L.speed * boost * dt / 1000) % L.period;
    }
    paint(now);

    outOff = (outOff + OUT_SPEED * boost * dt / 1000) % outLen;
    tOut.setAttribute("startOffset", String(-outLen + outOff));

    drawCaret(listening);
    // Both layers drift together, as a CSS transform rather than an attribute
    // — the browser can move a painted layer without repainting what is on it.
    tx += (mx - tx) * 0.06; ty += (my - ty) * 0.06;
    var sc = Math.max(-40, Math.min(40, (window.pageYOffset || 0) * 0.06));
    var d = "translate(" + tx.toFixed(1) + "px," + (ty - sc).toFixed(1) + "px)";
    cv.style.transform = d; svgEl.style.transform = d;
  }

  var riverEl = $("river");
  riverEl.addEventListener("pointermove", function (e) {
    var r = riverEl.getBoundingClientRect();
    mx = ((e.clientX - r.left) / r.width - 0.5) * 34;
    my = ((e.clientY - r.top) / r.height - 0.5) * 20;
  });
  riverEl.addEventListener("pointerleave", function () { mx = 0; my = 0; });

  /* A second ownRiver lived here, left over from the lanes version. Function
     declarations hoist, so it silently REPLACED the real one above — and it
     called fill(), which no longer exists, and read L.identity, which no
     longer exists either. Nothing showed it: it only runs after a visitor
     records something, which is the one path a page like this never takes
     while it is being built. */

  /* =====================================================================
     THE CARD
     Three claims, each demonstrated on the same card: the raw line is marked
     up word by word — struck through where it goes, amber where it must not
     move — a pill names the reason, and the written line resolves under it.
     ================================================================== */
  var rail = $("rail"), rawEl = $("raw"), outEl = $("out"), pillEl = $("pill");
  var step = 0, seq = [], dwell = 6400, running = false;

  function words(s) { return s.split(/\s+/).filter(Boolean); }
  function bare(s) { return s.toLowerCase().replace(/[^\p{L}\p{N}]/gu, ""); }

  function paintRail() {
    rail.innerHTML = "";
    C.steps.forEach(function (s, i) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = s.tab;
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(i === step));
      // A tab still selects, but in scroll mode it selects by MOVING THE
      // PAGE to where that claim lives. A control that jumped the card
      // without moving the page would leave the scroll position lying.
      b.onclick = function () { goToStep(i); };
      var p = document.createElement("p"); p.textContent = s.note;
      rail.appendChild(b);
      if (i === step) rail.appendChild(p);
    });
  }

  function clearSeq() { seq.forEach(clearTimeout); seq = []; }
  function at(ms, fn) { seq.push(setTimeout(fn, ms)); }

  function show(i) {
    clearSeq();
    step = ((i % C.steps.length) + C.steps.length) % C.steps.length;
    var s = C.steps[step];
    paintRail();
    // paintRail builds new buttons, so the bar has to be put back on the new
    // one — otherwise it reads empty from the moment a claim arrives until
    // the next scroll event, which is exactly when it should read full.
    paintFill();
    rail.style.setProperty("--dwell", dwell + "ms");

    // The raw line, one span a word, so each can be marked on its own.
    rawEl.innerHTML = "";
    var W = words(s.said), spans = [];
    W.forEach(function (w, k) {
      var el = document.createElement("span");
      el.textContent = w; rawEl.appendChild(el); spans.push(el);
      if (k < W.length - 1) rawEl.appendChild(document.createTextNode(" "));
    });
    outEl.textContent = "";
    pillEl.className = "pill";

    if (reduced) { markAll(spans, s); written(s); pillEl.textContent = s.pill; pillEl.className = "pill show"; return; }

    // Mark the words one at a time, so the reader watches it decide.
    var cut = (s.cut || []).map(bare), keep = (s.keep || []).map(bare), n = 0;
    spans.forEach(function (el) {
      var b = bare(el.textContent);
      if (cut.indexOf(b) >= 0) { at(420 + n * 150, function () { el.className = "gone"; }); n++; }
      else if (keep.indexOf(b) >= 0) { at(420 + n * 150, function () { el.className = "hit"; }); n++; }
    });
    at(520 + n * 150, function () { pillEl.textContent = s.pill; pillEl.className = "pill show"; });
    at(900 + n * 150, function () { written(s); });
    // Scroll is the clock wherever there is room to pin the card. The timer
    // only runs where there is not — a window too short to hold it still.
    if (running && span <= 0) at(dwell, function () { show(step + 1); });
  }

  /* ---------------------------------------------------------------------
     SCROLL PICKS THE CLAIM

     The track is three viewports tall and the card is pinned in the middle
     of it, so how far you have scrolled through the track IS which claim is
     on the card — forwards and backwards, at whatever speed you move. The
     rail's bar stops being a countdown and becomes a position.

     `span` is the scrollable part of the track. Where it is zero — a window
     too short to pin anything in, so the css has collapsed the track — there
     is nothing to read a position from and the timer takes over.        */
  var trackEl = $("track"), stickEl = $("stick"), trackTop = 0, span = 0;

  function measureTrack() {
    trackTop = trackEl.getBoundingClientRect().top + (window.pageYOffset || 0);
    span = trackEl.offsetHeight - stickEl.offsetHeight;
    rail.className = span > 0 ? "rail" : "rail timed";
  }

  function goToStep(i) {
    if (span <= 0) { show(i); return; }
    var to = trackTop + (i + 0.5) / C.steps.length * span;
    if (window.scrollTo) window.scrollTo({ top: to, behavior: reduced ? "auto" : "smooth" });
  }

  /** How far through the track, as a fraction of a claim. */
  function at01() {
    var p = ((window.pageYOffset || 0) - trackTop) / span;
    return Math.max(0, Math.min(0.9999, p)) * C.steps.length;
  }

  function paintFill() {
    var b = rail.querySelector('button[aria-selected="true"]');
    if (!b) return;
    if (!(span > 0)) { b.style.removeProperty("--fill"); return; }
    var t = at01();
    b.style.setProperty("--fill", (t - Math.floor(t)).toFixed(3));
  }

  function cardScroll() {
    if (!(span > 0)) return;
    var i = Math.floor(at01());
    if (i !== step) show(i); else paintFill();
  }

  /** The written line, with anything that had to survive left in amber. Built
   *  from nodes rather than a string of markup: every word on this page is
   *  copy the server sent, and copy is never markup. */
  function written(s) {
    var keep = (s.keep || []).map(bare);
    outEl.textContent = "";
    words(s.wrote).forEach(function (w, i) {
      if (i) outEl.appendChild(document.createTextNode(" "));
      if (keep.indexOf(bare(w)) >= 0) {
        var b = document.createElement("b"); b.textContent = w; outEl.appendChild(b);
      } else outEl.appendChild(document.createTextNode(w));
    });
  }
  function markAll(spans, s) {
    var cut = (s.cut || []).map(bare), keep = (s.keep || []).map(bare);
    spans.forEach(function (el) {
      var b = bare(el.textContent);
      if (cut.indexOf(b) >= 0) el.className = "gone";
      else if (keep.indexOf(b) >= 0) el.className = "hit";
    });
  }

  // ---- reveals & idling ---------------------------------------------------
  if (window.IntersectionObserver) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    [].forEach.call(document.querySelectorAll(".reveal"), function (el) { io.observe(el); });

    // The card only starts once it is looked at, and stops when it is not.
    new IntersectionObserver(function (es) {
      running = es[0].isIntersecting;
      if (running) show(step); else clearSeq();
    }, { threshold: 0.3 }).observe($("rail").parentNode);

    // The river never stops while it is on screen, so it must stop when it
    // is not — this is the one thing on the page that costs a phone battery.
    new IntersectionObserver(function (es) {
      var on = es[0].isIntersecting;
      if (on && !rraf && !reduced) { last = 0; rraf = requestAnimationFrame(river); }
      else if (!on && rraf) { cancelAnimationFrame(rraf); rraf = 0; }
    }, { threshold: 0 }).observe($("river"));
  } else {
    [].forEach.call(document.querySelectorAll(".reveal"), function (el) { el.classList.add("in"); });
    running = true;
  }

  // ---- downloads ----------------------------------------------------------
  function os() {
    var ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
    if (/Android/i.test(ua)) return "android";
    if (/Windows/i.test(ua)) return "win";
    if (/Mac OS X|Macintosh/i.test(ua)) return "mac";
    if (/Linux/i.test(ua)) return "linux";
    return "win";
  }
  var FILES = { win: "/downloads/Tailzu-Setup.exe", mac: "/downloads/Tailzu.dmg", linux: "/downloads/Tailzu.AppImage", ios: "/download", android: "/download" };
  function has(k) { return (k === "ios" || k === "android") ? true : !!site.downloads[k]; }

  function paintDownloads() {
    var el = $("dl"); el.innerHTML = "";
    var mine = os();
    var order = [mine].concat(["mac", "win", "ios", "android", "linux"].filter(function (k) { return k !== mine; })).slice(0, 4);
    // The filled button promises that something downloads. It goes to the
    // visitor's platform when there is an installer, otherwise to the first
    // one there is — never to a button that says "soon".
    var lead = has(mine) ? mine : (order.filter(has)[0] || null);
    order.forEach(function (k) {
      var ok = has(k);
      var a = document.createElement("a");
      a.href = ok ? FILES[k] : "#";
      a.textContent = (C.download[k] || k) + (ok ? "" : " · " + C.download.soon);
      a.className = (k === lead ? "primary" : "") + (ok ? "" : " soon");
      if (!ok) a.setAttribute("aria-disabled", "true");
      el.appendChild(a);
    });
    if (has(mine)) $("navdl").href = FILES[mine];
  }

  function under(msg, bad) { $("under").textContent = msg; $("under").className = bad ? "under err" : "under"; }

  function applyCopy() {
    $("headline").textContent = C.headline;
    $("proof").textContent = C.proof;
    $("getTitle").textContent = C.get;
    $("micLabel").textContent = C.cta;
    paintDownloads();
    if (!site.demo) { $("mic").disabled = true; under(C.demoOff); }
    else if (!own) under(C.invite);
  }

  // ---- the microphone -----------------------------------------------------
  var mic = $("mic"), micLabel = $("micLabel");
  var rec = null, stream_ = null, chunks = [], actx = null, analyser = null, vraf = 0;
  var startedAt = 0, heard = false, lastLoud = 0, hard = 0, busy = false;

  function pickMime() {
    var c = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
    for (var i = 0; i < c.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(c[i])) return c[i];
    return "";
  }
  function ext(m) { return /mp4/.test(m) ? "m4a" : /ogg/.test(m) ? "ogg" : "webm"; }

  function start() {
    if (busy) return;
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function (s) {
      stream_ = s; chunks = [];
      var m = pickMime();
      rec = new MediaRecorder(s, m ? { mimeType: m } : undefined);
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = upload;
      rec.start();
      startedAt = Date.now(); heard = false; lastLoud = startedAt;
      mic.setAttribute("aria-pressed", "true"); micLabel.textContent = C.ctaHeld;
      riverEl.classList.add("on"); listening = true;
      under(C.invite);
      level(s);
      hard = setTimeout(stop, site.maxSeconds * 1000);
    }).catch(function () { under(C.micDenied, true); });
  }

  function level(s) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = actx.createAnalyser(); analyser.fftSize = 128;
      actx.createMediaStreamSource(s).connect(analyser);
    } catch (e) { return; }
    var buf = new Uint8Array(analyser.frequencyBinCount);
    (function tick() {
      if (!analyser) return;
      analyser.getByteFrequencyData(buf);
      // One number, not a bank of them: the caret has a single height, so
      // the loudness of the whole voice is all there is to read.
      var sum = 0, n = Math.floor(buf.length / 2);
      for (var i = 0; i < n; i++) sum += buf[i] / 255;
      level = Math.min(1, (sum / n) * 3.2);
      var now = Date.now();
      if (level > 0.19) { heard = true; lastLoud = now; }
      // It stops itself when you pause. A pitch is one breath long.
      if (heard && now - lastLoud > 1400) { stop(); return; }
      vraf = requestAnimationFrame(tick);
    })();
  }

  function stop() {
    clearTimeout(hard);
    if (vraf) { cancelAnimationFrame(vraf); vraf = 0; }
    analyser = null;
    if (actx) { try { actx.close(); } catch (e) {} actx = null; }
    mic.setAttribute("aria-pressed", "false");
    riverEl.classList.remove("on"); listening = false;
    level = 0;
    if (rec && rec.state !== "inactive") { busy = true; micLabel.textContent = C.writing; rec.stop(); }
    else micLabel.textContent = C.cta;
    if (stream_) { stream_.getTracks().forEach(function (t) { t.stop(); }); stream_ = null; }
  }

  function done() { busy = false; micLabel.textContent = own ? C.again : C.cta; }

  function upload() {
    var m = (rec && rec.mimeType) || "audio/webm";
    var fd = new FormData();
    fd.append("audio", new Blob(chunks, { type: m }), "clip." + ext(m));
    fetch(API + "/v1/demo/transcribe", { method: "POST", body: fd }).then(function (r) {
      if (r.status === 413) throw new Error("Keep it under " + site.maxSeconds + " seconds.");
      if (r.status === 429) throw new Error("One moment — try again shortly.");
      if (r.status === 404) throw new Error(C.demoOff);
      if (!r.ok) throw new Error("Something went wrong. Try again.");
      return r.json();
    }).then(function (j) {
      var s = (j.transcript || "").trim(), w = (j.cleanedText || "").trim();
      if (!s && !w) throw new Error("Nothing heard. Try a little louder.");
      own = true;
      ownRiver(s, w || s);
      under(C.after);
      done();
    }).catch(function (e) { under(e.message || String(e), true); done(); });
  }

  function toggle() {
    if (mic.disabled) return;
    if (mic.getAttribute("aria-pressed") === "true") stop(); else start();
  }
  mic.addEventListener("click", toggle);
  // The mark is the control too: it is the thing that looks like it does this.
  var markEl = $("mark");
  markEl.addEventListener("click", toggle);

  /**
   * The button goes under the mark, and where that is has to be measured. The
   * river's svg is sliced, so the mark lands at a different place and a
   * different size at every window width — a percentage from the top is right
   * at one width and wrong at all the others.
   */
  function placeControl() {
    var m = markEl.getBoundingClientRect(), r = riverEl.getBoundingClientRect();
    if (!m.width || !r.width) return;
    var cx = m.left + m.width / 2 - r.left;
    // Clamped, because a wider window scales the sliced svg up and pushes the
    // mark's foot past the bottom of the band — where the sheet, which is
    // painted over it, would swallow the button and the line under it.
    var y = Math.min(m.bottom - r.top + 30, r.height - 118);
    mic.style.left = cx + "px"; mic.style.top = y + "px";
    $("under").style.left = cx + "px"; $("under").style.top = (y + 60) + "px";
  }
  // Measured once is measured too early: the first call can land before the
  // band has its final box, and then the button sits somewhere the mark is
  // not. Re-measure whenever the band changes size, which covers the late
  // layout, the fonts arriving and the window being dragged.
  if (window.ResizeObserver) new ResizeObserver(placeControl).observe(riverEl);
  window.addEventListener("load", function () { placeControl(); measureTrack(); cardScroll(); });
  measureTrack();
  markEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && mic.getAttribute("aria-pressed") === "true") stop();
  });

  // ---- boot ---------------------------------------------------------------
  applyCopy();
  paintRail();
  function boot() {
    sizeCanvas();
    loadRiver();
    if (!reduced && !rraf) { last = 0; rraf = requestAnimationFrame(river); }
    placeControl();
    show(0);
  }
  // The river measures text along a path, so it must not be laid out before
  // the face lands or every offset is computed for a fallback and jumps.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else window.addEventListener("load", boot);

  var rt = 0;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { sizeCanvas(); loadRiver(); placeControl(); measureTrack(); cardScroll(); }, 200);
  });

  // The hand comes from the font host, and the canvas measures words in
  // whatever face it has at the time. A phrase laid out in the fallback and
  // drawn in the real hand has every word in the wrong place, so the river
  // is laid out again once the hand has arrived.
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load("14px Caveat"), document.fonts.load("14px Kalam")])
      .then(function () { if (!own) loadRiver(); }, function () {});
  }

  fetch(API + "/v1/site").then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.copy) { for (var k in j.copy) if (Object.prototype.hasOwnProperty.call(j.copy, k)) C[k] = j.copy[k]; }
    if (j) {
      site.downloads = j.downloads || {};
      site.demo = !!j.demo;
      site.maxSeconds = j.maxSeconds || 15;
    }
    applyCopy();
    if (!own) { sizeCanvas(); loadRiver(); measureTrack(); show(0); cardScroll(); }   // the server may have sent other lines
  }).catch(function () { /* the fallbacks are already on screen */ });
})();
</script>
</body>
</html>
