<!doctype html>
<!--
  ASK, A PREVIEW: the desktop app's own guide (guide.js, blip.js, knobs.js and
  the pill in its frame, all unchanged copies) over a stand-in Chat app of
  ours, driven by drive.js the way ask.js drives it in the app. Shown on the
  home page in #ask, in a same-origin frame, only while /v1/site says Ask is
  "soon" or "live". The home page asks for a run: postMessage({run, calm}).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tailzu Ask, a preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Mono:wght@500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,300;1,6..72,400&display=swap">
<link rel="stylesheet" href="/demo/ask.css">
</head>
<body>
<div id="desk" aria-hidden="false">
  <div id="mockapp" role="img" aria-label="A chat app, the app being asked about">
    <div id="bar"><span class="dots"><i></i><i></i><i></i></span><span class="title">Chat</span><span class="search" id="m-search">Search Studio</span>
      <span class="tools"><span id="m-huddle">Huddle</span><span id="m-export">Export</span><span id="m-more">⋯</span></span></div>
    <div id="body">
      <div id="side">
        <h6>Channels</h6>
        <p id="m-general" class="on"># general</p><p id="m-design"># design</p><p id="m-launch"># launch</p>
        <h6>Direct messages</h6>
        <p>Priya</p><p>Anthony</p><p>Meera</p>
      </div>
      <div id="main">
        <div id="head"><span id="m-chan"># general</span><small id="m-topic">Company-wide notes</small></div>
        <div id="banner" role="alert"><b>Upload failed.</b> <span id="m-413">413 Request Entity Too Large</span> — deck-v2-final.key (<span id="m-size">212 MB</span>)</div>
        <div id="thread"></div>
        <div id="composer"><span class="field" id="m-field">Message #general</span><span id="send">Send</span></div>
      </div>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>
<div id="chip"></div>
<div id="card" role="dialog" aria-live="polite" data-state="listening">
  <div id="inner">
    <header>
      <i id="lamp"></i><span id="eyebrow">Listening</span><span id="app"></span><span id="badge"></span>
      <button id="close" aria-label="Stop"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
    </header>
    <p id="heard"></p>
    <div id="voice"><canvas id="wave"></canvas></div>
    <p id="say"></p>
    <ol id="steps"></ol>
    <div id="offer" hidden><button id="offerBtn"></button></div>
    <div id="ask">
      <div class="what" id="what"></div>
      <blockquote id="quote"></blockquote>
      <div class="row"><button id="yes">Do it</button><button id="no">Not now</button><kbd id="askHint">or tap Alt twice</kbd></div>
    </div>
    <div id="permit">
      <p id="permitText"></p>
      <div class="row"><button id="once">Allow once</button><button id="always">Always</button><button id="notnow">Not now</button></div>
    </div>
    <div id="foot"></div>
  </div>
</div>
<iframe id="pillframe" title="The Tailzu pill" aria-hidden="true" tabindex="-1" src="/demo/pill.html"></iframe>
<script src="/js/knobs.js?v=46a45b90"></script>
<script src="/js/blip.js?v=46feaa0c"></script>
<script src="/demo/drive.js"></script>
<script src="/demo/guide.js"></script>
</body>
</html>
